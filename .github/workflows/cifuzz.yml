name: CIFuzz

on:
  push:
    branches: [master, github-actions]
  pull_request:
    branches: [master]

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -Dsctp_build_programs=OFF -Dsctp_build_fuzzer=ON -Dsctp_sanitizer_address=ON -Dsctp_werror=OFF
      - name: Build fuzzers
        run: cmake --build build-fuzz --parallel 2 --target fuzzer_connect_multi fuzzer_listen fuzzer_fragment
      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          build-fuzz/fuzzer/fuzzer_connect_multi -runs=200 -timeout=10 fuzzer/CORPUS_CONNECT
          build-fuzz/fuzzer/fuzzer_listen -runs=200 -timeout=10 fuzzer/CORPUS_LISTEN
          build-fuzz/fuzzer/fuzzer_fragment -runs=200 -timeout=10 fuzzer/CORPUS_FRAGMENT
